<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="10%" y1="100%" x2="95%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0A1852" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>

  <!-- C and magnifying glass, touching directly with no gap -->
  <g filter="url(#soft)">
    <path d="M 716 315
             A 300 300 0 1 0 716 685"
          fill="none" stroke="#FFFFFF" stroke-width="105" stroke-linecap="round"/>
    <circle cx="640" cy="500" r="172" fill="none" stroke="#CFF6FE" stroke-width="64"/>
    <line x1="758" y1="618" x2="884" y2="744" stroke="#CFF6FE" stroke-width="64" stroke-linecap="round"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2451D6"/>
      <stop offset="100%" stop-color="#1330A6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E7F0FF"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0A1852" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- app-icon squircle background -->
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>

  <!-- C doubling as a magnifying-glass rim, handle extends from the opening -->
  <g filter="url(#soft)" stroke-linecap="round" transform="translate(33.5,9.5)">
    <path d="M 558.3 615.4 A 195 195 0 1 1 640.5 389.7"
          fill="none" stroke="url(#glass)" stroke-width="72"/>
    <line x1="553" y1="606" x2="700" y2="753"
          stroke="url(#glass)" stroke-width="66"/>
  </g>
</svg>

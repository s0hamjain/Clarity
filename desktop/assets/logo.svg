<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151B4D"/>
      <stop offset="55%" stop-color="#1E2A78"/>
      <stop offset="100%" stop-color="#2447A6"/>
    </linearGradient>
    <radialGradient id="sheen" cx="30%" cy="18%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#050A2A" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- app-icon squircle background -->
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#sheen)"/>

  <!-- faceted gem: "clarity" as in a clear-cut stone, catching light from every angle -->
  <g filter="url(#soft)">
    <!-- crown facets -->
    <polygon points="452,266 322,430 476,430 476,266" fill="#CFE8FA"/>
    <polygon points="476,266 548,266 548,430 476,430" fill="#FFFFFF"/>
    <polygon points="548,266 702,430 548,430" fill="#9FC9E8"/>

    <!-- girdle highlight line -->
    <polygon points="322,430 702,430 702,438 322,438" fill="#7FB2DC"/>

    <!-- pavilion facets -->
    <polygon points="322,438 476,438 512,742" fill="#EAF6FE"/>
    <polygon points="476,438 548,438 512,742" fill="#B9DEF3"/>
    <polygon points="548,438 702,438 512,742" fill="#6FA7D6"/>
  </g>

  <!-- twin sparkle: the light the gem is catching -->
  <path d="M 706 246 L 720 284 L 758 298 L 720 312 L 706 350 L 692 312 L 654 298 L 692 284 Z" fill="#FDE68A"/>
  <path d="M 300 300 L 308 320 L 328 328 L 308 336 L 300 356 L 292 336 L 272 328 L 292 320 Z" fill="#FDE68A" opacity="0.85"/>
</svg>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Rule 20: nothing here comes from the network. Scripts, styles and
         images are local only, and this window never connects anywhere.
         'unsafe-eval' is pywebview's bridge: window.evaluate_js() runs a
         string, so the host cannot talk to the page without it. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; style-src 'self'; script-src 'self' 'unsafe-eval'; img-src 'self' data:; connect-src 'none'" />
    <title>Clarity</title>
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="spotlight.css" />
  </head>
  <body>
    <div class="panel" id="panel">
      <div class="row">
        <img id="thumb" class="thumb" alt="" hidden />
        <div class="field">
          <input
            id="input"
            type="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            maxlength="2000"
          />
          <div id="message" class="message" hidden></div>
        </div>
        <div id="mode" class="mode" role="radiogroup" aria-label="Mode">
          <button type="button" id="mode-tutor" class="mode-btn" role="radio" aria-checked="false" title="Walk through the method, leave the last step to you">Tutor</button>
          <button type="button" id="mode-answer" class="mode-btn is-on" role="radio" aria-checked="true" title="Give the full explanation">Answer</button>
        </div>
        <div id="hint" class="hint">
          <kbd id="hint-recents" hidden>↓</kbd>
          <kbd>↵</kbd>
        </div>
      </div>

      <!-- Recents (FRD §15.1). Hidden until ↓ or "/" on an empty field; the
           window itself grows to fit, so this never scrolls the page. -->
      <div class="list-wrap" id="list-wrap" hidden>
        <div class="list" id="list" role="listbox" aria-label="Recent captures"></div>
        <p class="list-empty" id="list-empty" hidden>No recent captures yet.</p>
      </div>
    </div>
    <script src="spotlight.js"></script>
  </body>
</html>
